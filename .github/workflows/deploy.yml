name: Deploy slides to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

# Permissões necessárias para publicação no GitHub Pages via Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que múltiplos deploys não colidam
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build & Validate Slides
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Compile and validate slides with PowerShell
        shell: pwsh
        run: |
          ./slides/compor.ps1

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './slides'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # O deploy no ambiente github-pages só ocorre na branch main ou por acionamento manual.
    # Na branch dev, o pipeline apenas valida a compilação no job build.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
