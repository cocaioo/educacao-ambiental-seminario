     Cada item com class="fragment" aparece em um avanço; data-fragment-index define a ordem (mesmo número = juntos). -->
<section class="slide" id="modelo-texto-simples">
  <h2>Título do slide</h2>
  <ul>
    <li class="fragment" data-fragment-index="1">Primeira ideia.</li>
    <li class="fragment" data-fragment-index="2">Segunda ideia, com <strong>destaque</strong>.</li>
    <li class="fragment" data-fragment-index="3">Terceira ideia.</li>

  <!-- Fonte curta, sempre na base do slide. Detalhes e ressalvas vão nas notas do orador (tecla S). -->
  <p class="fonte">Fonte: SOBRENOME (ano).</p>
  <aside class="notes">
    <p>Notas do orador: aparecem só na visão do apresentador (tecla S), nunca para a plateia.</p>
  </aside>
</section>
