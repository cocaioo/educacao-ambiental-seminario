<!-- MODELO: tabela comparativa com uma linha por avanço.
     Mantenha <caption> e scope: são o texto alternativo da tabela. Poucas linhas e frases curtas. -->
<section class="slide" id="modelo-tabela">
  <h2>Título do slide</h2>

  <table>
    <caption class="so-leitor">Descreva em uma frase o que a tabela compara.</caption>
    <thead>
      <tr>
        <th scope="col">Critério</th>
        <th scope="col" class="cons">Coluna A</th>
        <th scope="col" class="prag">Coluna B</th>
        <th scope="col" class="crit">Coluna C</th>
      </tr>
    </thead>
    <tbody>
      <tr class="fragment" data-fragment-index="1">
        <th scope="row">Primeira linha</th>
        <td>Texto curto</td>
        <td>Texto curto</td>
        <td>Texto curto</td>
      </tr>
      <tr class="fragment" data-fragment-index="2">
        <th scope="row">Segunda linha</th>
        <td>Texto curto</td>
        <td>Texto curto</td>
        <td>Texto curto</td>
      </tr>
    </tbody>
  </table>

  <p class="fonte">Fonte: SOBRENOME (ano, p. 00).</p>
</section>
